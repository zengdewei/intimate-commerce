# ============================================================
# Intimate Commerce — 宿主 Nginx 站点配置（路线 A：原生部署）
#
# 安装：
#   sudo cp deploy/nginx/intimate-commerce.conf /etc/nginx/sites-available/intimate-commerce.conf
#   sudo sed -i 's/shop.example.com/你的域名/g' /etc/nginx/sites-available/intimate-commerce.conf
#   sudo ln -sf /etc/nginx/sites-available/intimate-commerce.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前置：前端构建产物放在 /var/www/intimate-commerce（deploy.sh 会自动同步）
# 兼容性：本配置使用 `listen 443 ssl http2` 旧写法，
#        因为 Ubuntu 22.04 自带 nginx 1.18、24.04 自带 1.24，
#        均不支持 1.25.1+ 的 `http2 on;` 指令。
# ============================================================

upstream intimate_commerce_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP：仅保留 ACME 校验，其余全部跳转 HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # certbot --webroot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS：静态站点 + API 反代 ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com;

    ssl_certificate           /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/shop.example.com/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # 静态资源的补充安全头；/api 的响应头由后端 helmet 负责
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    root  /var/www/intimate-commerce;
    index index.html;
    charset utf-8;

    # 站点无文件上传功能，限制小体积请求体降低风险
    client_max_body_size 2m;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ================= API 反向代理 =================
    # 注意：proxy_pass 末尾不带 /，保留原始 /api 前缀，
    #      与后端 setGlobalPrefix('api') 保持一致。
    location /api/ {
        proxy_pass              http://intimate_commerce_api;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        X-Forwarded-Host  $host;
        proxy_set_header        Connection        "";

        proxy_connect_timeout   5s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }

    # Stripe webhook 走 /api/store/webhook/stripe，已被上面的 location 覆盖。
    # 前端 vite.config.ts 里的 /webhooks 代理是开发期遗留项，生产无需单独配置。

    # ================= 静态资源 =================
    # Vite 产物文件名带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 必须每次回源校验，否则发版后用户拿到旧壳
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 路由回退：/admin、/orders/* 等都由前端 router 接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏文件与构建残留
    location ~ /\.(?!well-known) {
        deny all;
    }
}
