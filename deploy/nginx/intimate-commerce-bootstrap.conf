# ============================================================
# Intimate Commerce — 首次签发证书前使用的临时 HTTP-only 配置
#
# 用途：certbot --webroot 校验需要一个正在监听 80 端口的 server。
#      在证书尚未签发时先装本文件，签完证书后 deploy.sh 会自动换成正式配置。
#      本文件不会被长期使用，不包含 HTTPS server 块。
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # certbot --webroot 校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书未签发期间，站点暂时可经 HTTP 访问（仅用于联调，不要长期保留）
    root  /var/www/intimate-commerce;
    index index.html;

    location /api/ {
        proxy_pass              http://127.0.0.1:3000;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
