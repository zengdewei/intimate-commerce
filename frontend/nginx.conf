# ============================================================
# web 容器内置 Nginx（路线 B）
#
# 职责：托管前端静态产物 + 把 /api 反代到 compose 网络内的 api 容器。
# TLS 由宿主 Nginx 终结，本文件不涉及证书与 HSTS。
# ============================================================

server {
    listen 80;
    server_name _;

    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 2m;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # 容器健康检查端点
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ================= API 反向代理 =================
    # 使用变量 + Docker 内嵌 DNS（127.0.0.11）而非写死上游地址：
    # api 容器重建后 IP 会变化，写死会导致 nginx 一直指向旧 IP。
    # 变量形式下 nginx 会把原始 URI 原样转发，/api 前缀得以保留。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream "api:3000";

    location /api/ {
        proxy_pass              http://$api_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto https;
        proxy_set_header        Connection        "";

        proxy_connect_timeout   5s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }

    # ================= 静态资源 =================
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
